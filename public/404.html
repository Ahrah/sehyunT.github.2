<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SehyunT | 입시 컨설팅</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side router, so a direct hit on a path
      // like /payment/success (e.g. PayUp redirecting back here) 404s.
      // Encode the real path into a query string and bounce to index.html,
      // which decodes it back before React mounts. This preserves the path
      // instead of discarding it — needed so /payment/success etc. work.
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + '/?/' +
        l.pathname.slice(1).replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
