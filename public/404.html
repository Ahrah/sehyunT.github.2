<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SehyunT | 입시 컨설팅</title>
    <script type="text/javascript">
      // Simple SPA redirect for GitHub Pages
      var l = window.location;
      if (l.search[1] === '/' ) {
        var decoded = l.search.slice(1).split('&').map(function(s) { 
          return s.replace(/~and~/g, '&') 
        }).join('?');
        window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display: flex; height: 100vh; align-items: center; justify-content: center; font-family: sans-serif;">
        <p>페이지를 불러오는 중입니다...</p>
      </div>
    </div>
    <script>
      // If we are at the root or a subpath, redirect to index.html logic
      // For now, GitHub Pages will serve this 404.html if the path doesn't exist.
      // We want it to redirect back to the home page so React Router can handle it.
      if (window.location.pathname !== '/') {
        window.location.href = '/';
      }
    </script>
  </body>
</html>
